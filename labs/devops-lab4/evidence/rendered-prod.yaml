            exec:
              command: [sh, -c, 'pg_isready -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -p 5432 -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
