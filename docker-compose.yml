services:
  db-sandbox:
    image: postgres:16-alpine
    env_file: .env.sandbox
    ports:
      - "5432:5432"
    volumes:
      - pgdata_sandbox:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  db-production:
    image: postgres:16-alpine
    env_file: .env.production
    ports:
      - "5433:5432"
    volumes:
      - pgdata_production:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata_sandbox:
  pgdata_production: