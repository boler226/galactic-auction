# DVO-L4-3C8B52
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auction.fullname" . }}-secret
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auction.labels" . | nindent 4 }}
  annotations:
    {{- include "auction.annotations" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
