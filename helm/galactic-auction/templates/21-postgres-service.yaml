# DVO-L4-3C8B52
apiVersion: v1
kind: Service
metadata:
  name: {{ include "auction.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auction.labels" . | nindent 4 }}
  annotations:
    {{- include "auction.annotations" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: {{ .Values.postgres.port }}
