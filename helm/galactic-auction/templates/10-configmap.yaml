# DVO-L4-3C8B52
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "auction.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auction.labels" . | nindent 4 }}
  annotations:
    {{- include "auction.annotations" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ printf "%s-postgres" (include "auction.fullname" .) | quote }}
  POSTGRES_PORT: {{ .Values.postgres.port | quote }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
