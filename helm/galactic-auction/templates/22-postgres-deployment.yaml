# DVO-L4-3C8B52
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "auction.fullname" . }}-postgres
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "auction.labels" . | nindent 4 }}
  annotations:
    {{- include "auction.annotations" . | nindent 4 }}
spec:
  replicas: {{ .Values.postgres.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: postgres
        {{- include "auction.labels" . | nindent 8 }}
      annotations:
        {{- include "auction.annotations" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "auction.fullname" . }}-postgres
          args: ["-p", {{ .Values.postgres.port | quote }}]
          image: {{ .Values.postgres.image | quote }}
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: {name: '{{ include "auction.fullname" . }}-config', key: POSTGRES_USER}
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: {name: '{{ include "auction.fullname" . }}-config', key: POSTGRES_DB}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: {name: '{{ include "auction.fullname" . }}-secret', key: POSTGRES_PASSWORD}
          ports:
            - containerPort: {{ .Values.postgres.port }}
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: [sh, -c, 'pg_isready -p {{ .Values.postgres.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            periodSeconds: 5
          livenessProbe:
            exec:
              command: [sh, -c, 'pg_isready -p {{ .Values.postgres.port }} -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "auction.fullname" . }}-data
          {{- else }}
          emptyDir: {}
          {{- end }}
