# Development mode with hot reload (sandbox only):
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The local ./app folder is bind-mounted into the container, uvicorn runs with
# --reload, so code changes apply without rebuilding the image.

services:
  app-sandbox:
    command: >
      sh -c "alembic upgrade head &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload --reload-dir /code/app"
    environment:
      POSTGRES_HOST: db-sandbox
      POSTGRES_PORT: "5432"
      # file events from Windows bind mounts are not always delivered: poll instead
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./app:/code/app
